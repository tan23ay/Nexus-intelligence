name: Hourly Vercel rebuild

# Live stories come from the /api/news function; this workflow is the backup that
# rebuilds the site so the 31-day history in data.json keeps growing. Vercel's Hobby
# plan only allows daily cron, so GitHub triggers a Vercel deploy hook instead.
# GitHub cron is best-effort, so this runs twice an hour and only rebuilds when the
# baked data is over 50 minutes old. Manual runs always rebuild.
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one for "main",
# then save its URL as the repo secret VERCEL_DEPLOY_HOOK.

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

env:
  SITE: https://nexus-intelligence-radar.vercel.app

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel build if data is stale
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set"; exit 1; fi
          gen=$(curl -fsS --max-time 30 "$SITE/data.json?t=$(date +%s)" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["generated_at"])' || echo "")
          if [ -n "$gen" ] && [ "$FORCE" != "true" ]; then
            age=$(( $(date +%s) - $(date -d "$gen" +%s) ))
            echo "data.json generated $gen ($((age/60)) min ago)"
            if [ "$age" -lt 3000 ]; then echo "Fresh enough, skipping."; exit 0; fi
          fi
          HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]')   # strip stray whitespace from the pasted secret
          # -L: Vercel may answer with a 307/308 redirect; follow it and keep the POST.
          resp=$(curl -fsSL -X POST -w '\nHTTP %{http_code} via %{url_effective}' "$HOOK" | sed -E 's#(deploy/)[^ ?"]+#\1***#g')
          echo "$resp"
          echo "$resp" | grep -q '"job"' || { echo "Vercel did not accept the deploy hook (no job in response)"; exit 1; }
