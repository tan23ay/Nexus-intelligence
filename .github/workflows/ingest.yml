name: Hourly ingestion

# Cloud (Supabase + OpenAI) pipeline. Manual-only until the repo secrets are set;
# then re-enable the schedule below.
on:
  # schedule:
  #   - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false   # never run two ingests at once

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/pipeline/requirements.txt
      - run: pip install -r cloud/pipeline/requirements.txt
      - run: python cloud/pipeline/ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
