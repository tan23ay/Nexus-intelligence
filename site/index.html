<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Intelligence</title>
<meta name="description" content="Hourly news radar for renewable energy, AI infrastructure, semiconductors, GPUs and advanced packaging.">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234c8dff'/%3E%3Cpath d='M13 4 5 14h7l-1 6 8-10h-7l1-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #070b14; --panel: #0e1422; --panel-2: #131b2d; --line: #1e2840; --line-2: #2a3654;
    --text: #e6ebf5; --muted: #8b97b0; --dim: #5b6680;
    --accent: #4c8dff; --accent-soft: rgba(76,141,255,.12);
    --gold: #f5b544; --gold-soft: rgba(245,181,68,.10); --green: #3ccf91; --red: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 16px; align-items: center;
    justify-content: space-between; padding: 14px 24px; background: rgba(7,11,20,.85);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; gap: 12px; align-items: center; }
  .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .04em; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .status { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .btn { padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 8px; font-size: 12px; color: var(--text); }
  .btn:hover { background: var(--panel-2); }
  .btn[disabled] { opacity: .5; cursor: wait; }

  .layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; max-width: 1400px; margin: 0 auto; }
  main { padding: 20px 24px 60px; min-width: 0; }
  aside { border-left: 1px solid var(--line); padding: 20px; position: sticky; top: 65px; height: calc(100vh - 65px); overflow-y: auto; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
  .tab { display: flex; gap: 6px; align-items: center; white-space: nowrap; padding: 7px 14px; border-radius: 999px;
    background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 600; }
  .tab:hover { color: var(--text); background: var(--panel-2); }
  .tab.on { background: var(--accent); color: #fff; }
  .tab .n { font-weight: 500; opacity: .7; font-size: 11px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 14px 0 18px; }
  .seg { display: flex; background: var(--panel); border-radius: 8px; padding: 3px; }
  .seg button { padding: 5px 12px; border-radius: 6px; font-size: 12px; color: var(--muted); }
  .seg button.on { background: var(--line-2); color: var(--text); }
  .search { flex: 1; min-width: 180px; max-width: 360px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font-size: 13px; }
  .link { font-size: 12px; color: var(--muted); }
  .link:hover { color: var(--text); }

  .section-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--gold); margin: 6px 0 10px; }
  .heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .feed { display: flex; flex-direction: column; gap: 12px; }

  .card { display: flex; gap: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); transition: border-color .15s, opacity .15s; }
  .card:hover { border-color: var(--line-2); }
  .card.gc { border-color: rgba(245,181,68,.45); background: linear-gradient(180deg, var(--gold-soft), var(--panel) 60%); }
  .card.read { opacity: .45; }
  .body { flex: 1; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 11px; color: var(--dim); }
  .chip { padding: 2px 7px; border-radius: 5px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-2); font-weight: 600; }
  .chip.sub { background: var(--accent-soft); color: #9fc0ff; border-color: transparent; text-transform: none; }
  .chip.gcb { background: var(--gold-soft); color: var(--gold); border-color: rgba(245,181,68,.35); font-weight: 800; }
  .chip.fund { background: rgba(60,207,145,.1); color: var(--green); border-color: transparent; }
  button.chip, button.srcbtn { cursor: pointer; }
  button.chip:hover { border-color: var(--accent); color: var(--text); }
  .srcbtn { font-size: 11px; color: var(--muted); padding: 0; }
  .srcbtn:hover { color: var(--accent); text-decoration: underline; }

  .related { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; justify-content: space-between;
    padding: 16px 18px; margin-bottom: 18px; border: 1px solid var(--line-2); border-radius: var(--radius);
    background: linear-gradient(180deg, var(--accent-soft), var(--panel) 80%); }
  .related .section-label { color: #9fc0ff; margin: 0 0 4px; }
  .related h2 { margin: 0; font-size: 20px; text-transform: capitalize; }
  .related p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .related .ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
  .title { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
  .title:hover { color: var(--accent); }
  .hero .title { font-size: 18px; }
  .summary { color: var(--muted); font-size: 13px; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; flex-direction: column; gap: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
  .ic { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--dim); }
  .ic:hover { background: var(--panel-2); color: var(--text); }
  .ic.on.r { color: var(--green); } .ic.on.p { color: var(--accent); background: var(--accent-soft); }
  .ic.on.s { color: var(--gold); background: var(--gold-soft); }
  .ic svg { width: 18px; height: 18px; }

  .empty { text-align: center; padding: 48px 16px; color: var(--dim); border: 1px dashed var(--line-2); border-radius: var(--radius); }
  .more { margin: 18px auto 0; display: block; }

  aside h2 { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; font-size: 13px; letter-spacing: .06em; }
  .deal { display: block; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 10px; }
  .deal:hover { border-color: var(--line-2); }
  .deal .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .deal .co { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deal .amt { font-family: ui-monospace, Consolas, monospace; color: var(--green); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .deal .sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .deal .hl { font-size: 11px; color: var(--dim); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sources { margin-top: 24px; font-size: 11px; color: var(--dim); }
  .sources summary { cursor: pointer; color: var(--muted); }
  .sources li { list-style: none; display: flex; justify-content: space-between; padding: 2px 0; }
  .sources ul { padding: 0; margin: 8px 0 0; }
  .bad { color: var(--red); }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 600px) {
    header { padding: 12px 16px; } main { padding: 16px; }
    .brand p { display: none; }
    .status .txt { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heroes { grid-template-columns: 1fr; }
    .card { padding: 14px; gap: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <div><h1>NEXUS INTELLIGENCE</h1><p>Hourly energy, AI infrastructure &amp; semiconductor radar</p></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span class="txt" id="updated">Loading…</span>
    <button class="btn" id="refresh" title="Fetch the latest stories now">Refresh</button></div>
</header>

<div class="layout">
  <main>
    <nav class="tabs" id="tabs"></nav>
    <div class="toolbar">
      <div class="seg" id="sort">
        <button data-v="date" class="on">Latest</button><button data-v="impact">Highest impact</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search headlines…  (e.g. HBM, CoWoS, solar)">
      <button class="link" id="showread"></button>
    </div>
    <div id="heroWrap"></div>
    <div class="feed" id="feed"></div>
    <button class="btn more" id="more" hidden>Show more</button>
  </main>

  <aside>
    <h2><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ccf91" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>DEAL FLOW &amp; FUNDING</h2>
    <div id="deals"></div>
    <details class="sources"><summary id="srcsum">Sources</summary><ul id="srclist"></ul></details>
  </aside>
</div>

<script>
const CATS = [
  ["all", "All Intelligence"], ["saved", "Saved"],
  ["renewable_energy", "Renewable Energy"], ["ai_infrastructure", "AI Infrastructure"],
  ["semiconductors", "Semiconductors"], ["gpu_production", "GPUs & Packaging"],
  ["finance", "Finance"], ["education", "Education"], ["automations", "Automations"], ["automobiles", "Automobiles"],
];
const ICON = {
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>',
  bm: f => `<svg viewBox="0 0 24 24" fill="${f ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`,
  star: f => `<svg viewBox="0 0 24 24" fill="${f ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>`,
};
const PAGE = 40;
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
if (!LOCAL) document.getElementById("refresh").title = "Load the latest stories";
const KEY = "nexus-local-v1";

const store = (() => {
  let s = { reads: [], bm: {}, tab: "all", sort: "date" };
  try { s = { ...s, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch {}
  return { s, save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} } };
})();
const state = { data: null, showRead: false, q: "", limit: PAGE, reads: new Set(store.s.reads),
  topic: null, range: "week" };  // topic = { kind: "sub" | "cat" | "source", value }
const RANGES = { week: 7, month: 31 };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const label = s => s.replaceAll("_", " ");
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}

function persist() { store.s.reads = [...state.reads]; store.save(); }

// --- related-news view (#topic=sub:hbm&range=week), shareable by URL
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const t = p.get("topic") || "", i = t.indexOf(":");
  const kind = t.slice(0, i), value = t.slice(i + 1);
  state.topic = i > 0 && value && ["sub", "cat", "source"].includes(kind) ? { kind, value } : null;
  state.range = p.get("range") in RANGES ? p.get("range") : "week";
  state.limit = PAGE;
}
function goTopic(topic, range = "week") {
  const url = topic ? `#topic=${encodeURIComponent(topic.kind + ":" + topic.value)}&range=${range}`
    : location.pathname + location.search;
  history.pushState(null, "", url);
  readHash(); render(); window.scrollTo({ top: 0 });
}
const topicName = t => t.kind === "source" ? t.value : label(t.value);
const topicKind = t => ({ sub: "Topic", cat: "Sector", source: "Source" })[t.kind];
function matchesTopic(a, t) {
  if (t.kind === "sub") return (a.subcategories || []).includes(t.value);
  if (t.kind === "cat") return a.primary_category === t.value || (a.secondary_categories || []).includes(t.value);
  return a.source === t.value;
}
function googleNewsLink(t, range) {
  let term = topicName(t);
  if (t.kind === "source") {   // search the outlet's own site
    const a = state.data.articles.find(x => x.source === t.value);
    try { if (a) term = "site:" + new URL(a.url).hostname.replace(/^www\./, ""); } catch {}
  }
  return `https://news.google.com/search?q=${encodeURIComponent(`${term} when:${RANGES[range]}d`)}`;
}

function visible() {
  const { tab, sort, bm } = store.s;
  const q = state.q.toLowerCase();
  const t = state.topic, since = Date.now() - RANGES[state.range] * 864e5;
  let list = state.data.articles.filter(a => {
    if (t) return matchesTopic(a, t) && new Date(a.published_at) >= since;   // includes read stories
    if (tab === "saved") return !!bm[a.id];
    if (!state.showRead && state.reads.has(a.id)) return false;
    if (tab !== "all" && a.primary_category !== tab) return false;
    return true;
  });
  if (q) list = list.filter(a => (a.title + " " + a.summary + " " + a.source).toLowerCase().includes(q));
  return list.sort((x, y) => sort === "impact"
    ? y.impact_score - x.impact_score || (y.published_at > x.published_at ? 1 : -1)
    : (y.published_at > x.published_at ? 1 : -1));
}

function card(a, hero) {
  const bm = store.s.bm[a.id] || {};
  const read = state.reads.has(a.id);
  const subs = (a.subcategories || []).map(s =>
    `<button class="chip sub" data-topic="sub" data-val="${esc(s)}" title="All ${esc(label(s))} news, past week / month">${esc(label(s))}</button>`).join("");
  return `<article class="card ${a.is_game_changer ? "gc" : ""} ${hero ? "hero" : ""} ${read ? "read" : ""}" data-id="${a.id}">
    <div class="body">
      <div class="meta">
        ${a.is_game_changer ? `<span class="chip gcb">⚡ Game-changer ${a.impact_score.toFixed(1)}</span>` : `<span class="score" title="Impact score">${a.impact_score.toFixed(1)}</span>`}
        <button class="chip" data-topic="cat" data-val="${esc(a.primary_category)}" title="All ${esc(label(a.primary_category))} news, past week / month">${esc(label(a.primary_category))}</button>${subs}
        ${a.funding ? `<span class="chip fund">${esc(a.funding.raw_amount_string)}</span>` : ""}
        <span><button class="srcbtn" data-topic="source" data-val="${esc(a.source)}" title="More from ${esc(a.source)}">${esc(a.source)}</button> · ${ago(a.published_at)}</span>
      </div>
      <a class="title" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>
      ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
    </div>
    <div class="actions">
      <button class="ic r ${read ? "on" : ""}" data-act="read" title="${read ? "Mark unread" : "Mark read (dismiss)"}" aria-pressed="${read}">${read ? ICON.check : ICON.box}</button>
      <button class="ic p ${bm.primary ? "on" : ""}" data-act="primary" title="Primary bookmark" aria-pressed="${!!bm.primary}">${ICON.bm(bm.primary)}</button>
      <button class="ic s ${bm.secondary ? "on" : ""}" data-act="secondary" title="Secondary bookmark" aria-pressed="${!!bm.secondary}">${ICON.star(bm.secondary)}</button>
    </div>
  </article>`;
}

function render() {
  if (!state.data) return;
  const { tab, sort, bm } = store.s;
  const all = state.data.articles;
  const counts = {};
  for (const a of all) if (!state.reads.has(a.id)) counts[a.primary_category] = (counts[a.primary_category] || 0) + 1;
  counts.all = all.filter(a => !state.reads.has(a.id)).length;
  counts.saved = Object.keys(bm).filter(id => all.some(a => a.id === id)).length;

  const t = state.topic;
  $("tabs").innerHTML = CATS.map(([id, name]) =>
    `<button class="tab ${!t && tab === id ? "on" : ""}" data-tab="${id}">${esc(name)} <span class="n">${counts[id] || 0}</span></button>`).join("");
  document.querySelectorAll("#sort button").forEach(b => b.classList.toggle("on", b.dataset.v === sort));
  $("showread").hidden = tab === "saved" || !!t;
  $("showread").textContent = state.showRead ? "Hide read" : `Show read (${state.reads.size})`;

  const list = visible();
  const heroes = tab === "saved" || state.q || t ? [] : list.filter(a => a.is_game_changer).slice(0, 4);
  const rest = list.filter(a => !heroes.includes(a));
  const rangeTxt = state.range === "month" ? "past month" : "past week";
  $("heroWrap").innerHTML = t
    ? `<section class="related">
        <div><div class="section-label">RELATED NEWS · ${esc(topicKind(t).toUpperCase())}</div>
          <h2>${esc(topicName(t))}</h2>
          <p>${list.length} ${list.length === 1 ? "story" : "stories"} in the ${rangeTxt}</p></div>
        <div class="ctl">
          <div class="seg">${Object.keys(RANGES).map(r =>
            `<button data-range="${r}" class="${state.range === r ? "on" : ""}">Past ${r}</button>`).join("")}</div>
          <a class="link" href="${esc(googleNewsLink(t, state.range))}" target="_blank" rel="noopener noreferrer">Google News ↗</a>
          <button class="link" data-copy>Copy link</button>
          <button class="link" data-clear>✕ Back to all</button>
        </div></section>`
    : heroes.length
    ? `<div class="section-label">GAME-CHANGERS</div><div class="heroes">${heroes.map(a => card(a, true)).join("")}</div>` : "";
  const emptyMsg = t ? `No ${esc(topicName(t))} stories in the ${rangeTxt}${state.q ? " matching your search" : ""}.`
    : tab === "saved" ? "Nothing bookmarked yet." : state.q ? "No matches." : "All caught up here. New stories arrive every hour.";
  $("feed").innerHTML = rest.slice(0, state.limit).map(a => card(a)).join("") ||
    (heroes.length ? "" : `<div class="empty">${emptyMsg}</div>`);
  $("more").hidden = rest.length <= state.limit;
  $("more").textContent = `Show more (${rest.length - state.limit})`;

  const deals = all.filter(a => a.funding).sort((x, y) => (y.published_at > x.published_at ? 1 : -1)).slice(0, 25);
  $("deals").innerHTML = deals.map(a => `<a class="deal" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
      <div class="row"><span class="co">${esc(a.funding.company_name)}</span><span class="amt">${esc(a.funding.raw_amount_string)}</span></div>
      <div class="sub">${esc(a.funding.round_type)} · ${esc(label(a.funding.sector))} · ${ago(a.published_at)}</div>
      <div class="hl">${esc(a.title)}</div></a>`).join("") || `<p class="link">No deals detected yet.</p>`;

  const src = state.data.sources || [];
  $("srcsum").textContent = `Sources (${src.filter(s => s.ok).length}/${src.length} live)`;
  $("srclist").innerHTML = src.map(s => `<li><span>${esc(s.source)}</span><span class="${s.ok ? "" : "bad"}">${s.ok ? s.count : "unavailable"}</span></li>`).join("");
  $("updated").textContent = `Updated ${ago(state.data.generated_at)} · ${all.length} stories`;
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  const d = await r.json();
  if (!Array.isArray(d.articles)) throw new Error(`${url}: no articles`);
  return d;
}
async function load() {
  try {
    // Online: /api/news fetches the feeds live (CDN-cached ~15 min). data.json, baked
    // into the last deploy, is the fallback. Locally the server rewrites data.json.
    let d = null;
    if (!LOCAL) d = await getJSON("/api/news").catch(e => (console.warn(e), null));
    d ||= await getJSON("data.json?t=" + Date.now(), { cache: "no-store" });
    if (state.data && d.generated_at < state.data.generated_at) d = state.data;  // never go backwards
    state.data = d;
    const ids = new Set(d.articles.map(a => a.id));            // forget reads of expired stories
    const kept = [...state.reads].filter(id => ids.has(id));
    if (kept.length !== state.reads.size) { state.reads = new Set(kept); persist(); }
    const stale = Date.now() - new Date(d.generated_at) > 2 * 3600e3;
    $("dot").style.background = stale ? "var(--gold)" : "";
    $("dot").title = stale ? "Data is more than 2 hours old" : "Live";
  } catch (e) {
    console.error(e);
    if (state.data) return;   // keep showing what we have
    $("updated").textContent = LOCAL ? "Couldn’t load data — is the local server running?" : "Couldn’t load data — try again shortly.";
    $("dot").style.background = "var(--red)";
    return;
  }
  render();
}

// --- events
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  store.s.tab = b.dataset.tab; state.limit = PAGE; store.save();
  if (state.topic) goTopic(null); else { render(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("click", e => {
  const tp = e.target.closest("[data-topic]");
  if (tp) return goTopic({ kind: tp.dataset.topic, value: tp.dataset.val }, state.topic ? state.range : "week");
  const rg = e.target.closest("[data-range]");
  if (rg && state.topic) return goTopic(state.topic, rg.dataset.range);
  if (e.target.closest("[data-clear]")) return goTopic(null);
  const cp = e.target.closest("[data-copy]");
  if (cp) navigator.clipboard?.writeText(location.href).then(() => {
    cp.textContent = "Copied!"; setTimeout(() => (cp.textContent = "Copy link"), 1500);
  }).catch(() => {});
});
window.addEventListener("popstate", () => { readHash(); render(); });
$("sort").addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  store.s.sort = b.dataset.v; store.save(); render();
});
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.limit = PAGE; render(); });
$("showread").addEventListener("click", () => { state.showRead = !state.showRead; render(); });
$("more").addEventListener("click", () => { state.limit += PAGE; render(); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest("[data-id]").dataset.id, act = b.dataset.act;
  if (act === "read") { state.reads.has(id) ? state.reads.delete(id) : state.reads.add(id); persist(); }
  else {
    const m = { ...(store.s.bm[id] || {}) };
    m[act] ? delete m[act] : (m[act] = true);
    if (Object.keys(m).length) store.s.bm[id] = m; else delete store.s.bm[id];
    store.save();
  }
  render();
});
$("refresh").addEventListener("click", async () => {
  const b = $("refresh"); b.disabled = true; b.textContent = "Fetching…";
  // Locally, ask the server to re-fetch now; online, /api/news is already live.
  if (LOCAL) { try { await fetch("/api/refresh", { method: "POST" }); } catch {} }
  await load(); b.disabled = false; b.textContent = "Refresh";
});

readHash();
load();
setInterval(load, 5 * 60 * 1000);           // pick up the server's hourly refresh
setInterval(() => state.data && render(), 60 * 1000); // keep "x min ago" fresh
</script>
</body>
</html>
