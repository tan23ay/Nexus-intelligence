[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js runtime (Netlify auto-installs this for Next sites; pinned here explicitly).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hourly ingestion runs in GitHub Actions (.github/workflows/ingest.yml), not here:
# Netlify Functions can't run Python, and scheduled functions are capped at 30s,
# far too short for scraping + LLM enrichment across ~16 sources.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
